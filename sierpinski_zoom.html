<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sierpinski — zoom + révélation progressive (sans carving)</title>
<style>
  html,body{height:100%;margin:0;background:#111;color:#ddd;font:14px/1.4 system-ui,Segoe UI,Roboto,Ubuntu,Arial}
  header{padding:8px 12px;background:#181818;border-bottom:1px solid #222}
  #hud{opacity:.8}
  #cv{display:block;background:#fff;width:100vw;height:calc(100vh - 50px)}
  button,input{background:#222;border:1px solid #333;color:#eee;padding:6px 10px;border-radius:8px}
  input[type=range]{vertical-align:middle}
</style>
</head>
<body>
  <header>
    <button id="play">Pause</button>
    <label>Vitesse: <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></label>
    <label>Profondeur max: <input id="depth" type="range" min="1" max="10" step="1" value="8"></label>
    <span id="hud"></span>
  </header>
  <canvas id="cv"></canvas>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', { alpha:false });
  const playBtn = document.getElementById('play');
  const speedInp = document.getElementById('speed');
  const depthInp = document.getElementById('depth');
  const hud = document.getElementById('hud');

  const H = Math.sqrt(3)/2; // hauteur d'un tri équilatéral de côté 1
  let playing = true;
  let speed = +speedInp.value;
  let maxDepth = +depthInp.value;

  function sizeCanvas(){
    const r = cv.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    cv.width  = Math.max(2, Math.floor(r.width  * dpr));
    cv.height = Math.max(2, Math.floor(r.height * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', sizeCanvas, {passive:true});
  sizeCanvas();

  function worldBox(level){
    const w = Math.pow(0.5, level);
    return {x:0.5 - w/2, y:0, w, h:H*w};
  }
  function lerp(a,b,u){ return a + (b-a)*u; }

  function setViewFrom(box){
    const r = cv.getBoundingClientRect();
    const sx = r.width  / box.w;
    const sy = r.height / box.h;
    ctx.setTransform(sx,0,0,sy,-box.x*sx,-box.y*sy);
  }

  // Dessine un triangle par ses 3 sommets
  function fillTri3(A,B,C){
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.lineTo(B.x, B.y);
    ctx.lineTo(C.x, C.y);
    ctx.closePath();
    ctx.fill();
  }

  // Retourne les 3 sous-triangles (haut, bas-gauche, bas-droit) du triangle ABC
  function subTriangles(A,B,C){
    const AB = {x:(A.x+B.x)/2, y:(A.y+B.y)/2};
    const AC = {x:(A.x+C.x)/2, y:(A.y+C.y)/2};
    const BC = {x:(B.x+C.x)/2, y:(B.y+C.y)/2};
    // Sous-triangles pleins de Sierpinski
    return [
      [A, AB, AC],   // haut
      [AB, B, BC],   // bas-gauche
      [AC, BC, C],   // bas-droit
    ];
  }

  // Interpole un triangle depuis son centroïde vers sa position finale (facteur t in [0,1])
  function growTriangle(T, t){
    const G = {
      x: (T[0].x + T[1].x + T[2].x)/3,
      y: (T[0].y + T[1].y + T[2].y)/3
    };
    return [
      {x: lerp(G.x, T[0].x, t), y: lerp(G.y, T[0].y, t)},
      {x: lerp(G.x, T[1].x, t), y: lerp(G.y, T[1].y, t)},
      {x: lerp(G.x, T[2].x, t), y: lerp(G.y, T[2].y, t)},
    ];
  }

  // Révélation progressive SANS triangle plein de fond:
  // - si currentLevel < floor(effDepth): déplie entièrement (3 sous-niveaux).
  // - si currentLevel == floor(effDepth): dessine UNIQUEMENT les 3 sous-tris qui GRANDISSENT (t=frac(effDepth)).
  // - si currentLevel > floor(effDepth): ne dessine rien (trop tôt).
  function drawProgressive(A,B,C, currentLevel, effDepth, maxDepth){
    if (currentLevel >= maxDepth) return;

    const k = Math.floor(effDepth);
    const t = effDepth - k;

    if (currentLevel < k){
      const subs = subTriangles(A,B,C);
      drawProgressive(...subs[0], currentLevel+1, effDepth, maxDepth);
      drawProgressive(...subs[1], currentLevel+1, effDepth, maxDepth);
      drawProgressive(...subs[2], currentLevel+1, effDepth, maxDepth);
    } else if (currentLevel > k){
      // On attend le zoom
      return;
    } else {
      // currentLevel == k : on fait GRANDIR les 3 sous-triangles
      const subs = subTriangles(A,B,C);
      const g0 = growTriangle(subs[0], t);
      const g1 = growTriangle(subs[1], t);
      const g2 = growTriangle(subs[2], t);
      fillTri3(g0[0], g0[1], g0[2]);
      fillTri3(g1[0], g1[1], g1[2]);
      fillTri3(g2[0], g2[1], g2[2]);
      // On ne descend pas encore aux niveaux suivants; ils arriveront au prochain palier.
    }
  }

  // Animation
  let T = 0, last = performance.now();
  const secPerLevel = 1.2;

  function frame(now){
    const dt = (now - last)/1000; last = now;
    if (playing) T += dt * speed;

    const pos = T / secPerLevel;
    const eff = ((pos % maxDepth) + maxDepth) % maxDepth; // [0, maxDepth)

    // Interpolation de la vue entre deux niveaux
    const base = Math.floor(eff), u = eff - base;
    const b0 = worldBox(base), b1 = worldBox(base+1);
    const view = { x: lerp(b0.x,b1.x,u), y: lerp(b0.y,b1.y,u), w: lerp(b0.w,b1.w,u), h: lerp(b0.h,b1.h,u) };

    // Efface
    ctx.setTransform(1,0,0,1,0,0);
    const r = cv.getBoundingClientRect();
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,r.width,r.height);

    // Place la vue
    setViewFrom(view);

    // Dessin noir
    ctx.fillStyle = '#000';

    // Triangle monde de départ (équilatéral côté 1)
    const A = {x:0.5, y:0};
    const B = {x:0,   y:H};
    const C = {x:1,   y:H};

    drawProgressive(A,B,C, 0, eff, maxDepth);

    // HUD
    ctx.setTransform(1,0,0,1,0,0);
    hud.textContent = `niveau ${eff.toFixed(2)} / ${maxDepth} | vitesse ×${speed}`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // UI
  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Lecture';
  });
  speedInp.addEventListener('input', () => speed = +speedInp.value);
  depthInp.addEventListener('input', () => maxDepth = +depthInp.value);
})();
</script>
</body>
</html>
